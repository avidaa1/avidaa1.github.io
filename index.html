<title>AVIDAA - Constellation</title>
<style>
:root{--bg:#050818;--fg:#F3F1FF;--muted:#B3B0DD;--line:rgba(255,255,255,.14);--font:ui-rounded,'SF Pro Rounded','Arial Rounded MT Bold','Varela Round',system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;--mono:ui-monospace,'SF Mono','Cascadia Mono','DejaVu Sans Mono',Menlo,Consolas,monospace;--top:64px}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-text-size-adjust:100%}
body{overflow:hidden}
button,a{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid #FFD93D;outline-offset:3px;border-radius:8px}
.top{position:fixed;left:0;right:0;top:0;height:var(--top);z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;background:rgba(6,9,30,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:38px;height:38px;flex:none}
.brand b{font-size:clamp(1.15rem,3.4vw,1.6rem);font-weight:900;letter-spacing:.04em;background:linear-gradient(100deg,#FFD93D,#FF7AA8 45%,#5BC0FF 85%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.brand span{color:var(--muted);font-weight:800;font-size:1rem;white-space:nowrap}
.tools{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;min-width:48px;padding:0 16px;border-radius:999px;border:2px solid rgba(255,255,255,.22);background:rgba(255,255,255,.09);color:var(--fg);font-weight:800;font-size:.95rem;cursor:pointer;text-decoration:none;white-space:nowrap}
.pill:hover{background:rgba(255,255,255,.18)}
.pill:active{transform:scale(.96)}
.pill svg{width:22px;height:22px;flex:none}
.pill kbd{font:700 .8rem var(--mono);padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.14)}
.pill[aria-pressed="true"]{background:linear-gradient(135deg,#7C5CFF,#FF5FA2);border-color:transparent}
@media(max-width:640px){.pill .lbl,.pill kbd,.brand span{display:none}.pill{padding:0 12px}}
#rain,#sky{position:fixed;left:0;top:0;width:100%;height:100%}
#rain{opacity:.16;z-index:0}
#sky{z-index:1;pointer-events:none}
#mapview{position:fixed;inset:0;z-index:2}
#stars{position:absolute;inset:0}
.bgglow{position:fixed;inset:0;z-index:0;background:radial-gradient(110% 80% at 18% 0%,#1B1456 0%,transparent 60%),radial-gradient(90% 70% at 90% 100%,#0B3A4A 0%,transparent 60%),linear-gradient(180deg,#070A22,#050818)}
.star{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border:0;background:none;cursor:pointer;display:grid;place-items:center;will-change:transform}
.star .core{width:13px;height:13px;border-radius:50%;background:var(--c);transition:transform .2s}
.star .lab{position:absolute;left:34px;top:50%;transform:translateY(-50%);white-space:nowrap;font-weight:800;font-size:.95rem;padding:3px 10px;border-radius:999px;background:rgba(5,8,24,.85);border:1px solid var(--c);opacity:0;pointer-events:none;transition:opacity .15s;z-index:3}
.star:hover .lab,.star:focus-visible .lab,.star.sel .lab{opacity:1}
.star.offline .core{opacity:.5;box-shadow:0 0 6px 1px var(--c)}
.star.fix .core{background:#FFA94D;box-shadow:0 0 10px 3px #FFA94D}
@media (prefers-reduced-motion:no-preference){.star .core{animation:tw var(--d,3.4s) ease-in-out infinite;animation-delay:var(--l,0s)}}
@keyframes tw{0%,100%{opacity:.7}50%{opacity:1}}
.star.corenode .core{animation:none}
.slabel{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:.95rem;letter-spacing:.18em;text-transform:uppercase;color:var(--c);text-shadow:0 0 14px var(--c);pointer-events:none;white-space:nowrap;opacity:.95}
.slabel small{font-weight:800;letter-spacing:.06em;color:var(--muted);margin-left:6px;text-shadow:none}
#vida{position:fixed;left:calc(14px + var(--rl,0px));bottom:14px;z-index:6;display:flex;align-items:flex-end;gap:12px}
#vida-host{line-height:0}
.vida-mini-cv{display:block;border-radius:18px;border:2px solid #5BC0FF;box-shadow:0 0 28px rgba(91,192,255,.35);background:#02040c}
#vida .say{max-width:190px;padding:9px 14px;border-radius:16px;background:rgba(91,192,255,.16);border:1px solid rgba(91,192,255,.6);font-weight:800;font-size:1rem;line-height:1.3;margin-bottom:12px;cursor:pointer}
body.cards #vida{position:static;margin:34px 0 0}
#brainbox{position:fixed;right:calc(12px + var(--rr,0px));bottom:12px;z-index:6;width:min(300px,calc(100vw - 24px));padding:10px 12px;border-radius:16px;background:rgba(6,9,30,.84);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#brain-read{font:700 .9rem/1.35 var(--mono);color:#B3B0DD}
#brainbox .note{font-weight:800;font-size:.9rem;color:#B3B0DD}
body.panel-sheet #vida,body.panel-sheet #brainbox{opacity:0;pointer-events:none}
#panel{position:fixed;z-index:30;display:none;padding:16px;background:rgba(8,11,36,.96);border:2px solid var(--c,#5BC0FF);box-shadow:0 0 30px -4px var(--c,#5BC0FF),0 20px 50px rgba(0,0,0,.6);overflow-y:auto;font-family:var(--font)}
#panel.show{display:block}
#panel.side{top:calc(var(--top) + 8px);bottom:12px;border-radius:22px}
#panel.side.left{left:12px}#panel.side.right{right:12px}
#panel.sheet{left:0;right:0;bottom:0;max-height:40vh;border-radius:22px 22px 0 0;border-bottom:0;padding-top:8px}
#pgrab{display:none;height:44px;margin:-8px -16px 0;align-items:center;justify-content:center;touch-action:none;cursor:grab}
#panel.sheet #pgrab{display:flex}
#pgrab i{display:block;width:48px;height:5px;border-radius:3px;background:rgba(255,255,255,.38)}
#pclose{position:absolute;right:6px;top:6px;width:44px;height:44px;border-radius:50%;border:0;background:none;color:var(--muted);font-size:1.5rem;cursor:pointer;z-index:2}
#panel.sheet #pclose{top:2px}
#panel .chip{display:inline-block;font-weight:900;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin-bottom:4px;padding-right:44px}
#panel h2{font-size:1.5rem;line-height:1.1;margin-bottom:6px;padding-right:44px}
#panel p{color:#DAD7F5;font-size:1rem;line-height:1.4;margin-bottom:10px}
#panel .cap{font-weight:800;font-size:.9rem;color:var(--muted);margin:10px 0 6px}
#panel .lk{min-height:44px;padding:0 12px;margin:0 6px 6px 0;border-radius:999px;border:1.5px solid var(--c);background:rgba(255,255,255,.06);color:var(--fg);font:800 .9rem var(--font);cursor:pointer}
#panel .lk:hover{background:rgba(255,255,255,.14)}
#panel .acts{margin-top:10px}
.star .core{transform:scale(calc(1 + var(--act,0) * 1.4));box-shadow:0 0 calc(10px + var(--act,0) * 28px) calc(3px + var(--act,0) * 9px) var(--c),0 0 26px 8px color-mix(in srgb,var(--c) 45%,transparent)}
.star:hover .core,.star:focus-visible .core,.star.sel .core{transform:scale(calc(1.7 + var(--act,0)))}
.star.hub .core{width:20px;height:20px;background:rgba(5,8,24,.6);border:3px solid var(--c)}
.star.corenode .core{width:26px;height:26px;background:radial-gradient(circle,#FFD93D,#FF7AA8);box-shadow:0 0 22px 6px rgba(255,217,61,.7)}
/* palette */
#pal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;padding:12vh 12px 0;background:rgba(3,5,18,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#pal.show{display:flex}
.pbox{width:min(620px,100%);border-radius:20px;background:#0B0F30;border:2px solid #7C5CFF;box-shadow:0 30px 80px rgba(0,0,0,.7);overflow:hidden}
.phead{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-right:10px}
#pq{flex:1;min-width:0;min-height:58px;padding:0 20px;background:none;border:0;color:var(--fg);font:800 1.15rem var(--font);outline:none}
.pclose{flex:none;min-width:44px;min-height:44px;padding:0 18px;border-radius:999px;border:2px solid var(--line);background:rgba(255,255,255,.1);color:var(--fg);font:800 .95rem var(--font);cursor:pointer}
#pal input:focus,#pal button:focus,#pal a:focus{outline:3px solid #FFD93D;outline-offset:-3px}
#pl{list-style:none;max-height:min(52vh,420px);overflow-y:auto}
#pl li{display:block;min-height:52px}
#pl a.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 18px;color:inherit;text-decoration:none;cursor:pointer}
#pl li.none{display:flex;align-items:center;gap:12px;padding:6px 18px;color:var(--muted)}
#pl li[aria-selected="true"],#pl a.row:focus{background:rgba(124,92,255,.35)}
#pl .nm{font-weight:900;font-size:1.05rem}
#pl .ds{color:var(--muted);font-size:.9rem;margin-left:auto;text-align:right;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phint{padding:10px 18px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}
/* card view */
#cardview{position:absolute;inset:0;z-index:2;overflow-y:auto;padding:calc(var(--top) + 16px) 14px 40px;display:none}
body.cards #cardview{display:block}
body.cards #mapview,body.cards #sky{display:none}
body:not(.cards) #cardview{display:none}
.cwrap{max-width:1100px;margin:0 auto}
.chead{display:flex;align-items:center;gap:14px;margin:6px 0 16px;min-height:56px}
